howto_01_ft-staging:
  stage: deploy_fluid-topics
  dependencies:
    - build_mkdocs_howto
  script:
    - pip install requests pyyaml
    - chmod +x tools/ft/howto/metadata.py
    - python3 tools/ft/howto/metadata.py
    - chmod +x tools/ft/howto/upload.py
    - python3 tools/ft/howto/upload.py staging  # Command to execute your script with staging environment
  artifacts:
    paths:
      - '*.zip'  # Capture any ZIP file produced by your script
  when: manual # This job will only run when manually triggered

howto_02_ft-prod:
  stage: deploy_fluid-topics
  dependencies:
    - build_mkdocs_howto
  script:
    - pip install requests pyyaml
    - chmod +x tools/ft/howto/metadata.py
    - python3 tools/ft/howto/metadata.py
    - chmod +x tools/ft/howto/upload.py
    - python3 tools/ft/howto/upload.py prod  # Command to execute your script with production environment
  artifacts:
    paths:
      - '*.zip'  # Capture any ZIP file produced by your script
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([~\-\+]+.+)?/'
  when: manual # This job will only run when manually triggered
  needs:
    - job: howto_01_ft-staging  # Ensure ft-staging runs before ft-publish
    - job: build_mkdocs_howto