# ------------------------------------------------------------------
# Build stage

build_mkdocs_release-notes:
  stage: build
  variables:
    EDIT_URI: edit/$CI_COMMIT_REF_NAME/docs # Edit Button on rendered sites will link to file and branch directly
  script:
    - poetry install --no-root
    - poetry run mkdocs build -f tools/mkdocs/mkdocs_release-notes.yml --strict
  artifacts:
    paths:
      - site/release-notes
    expire_in: 1 week
  tags:
    - DOCKER

review_app_release-notes: # Create a review environment (named after the current branch) and link to the latest job artifact
  extends: .deploy_mkdocs_release-notes
  script:
    - env
    - >-
      if [ -d site/release-notes ]; then mkdir -p public/release-notes; cp -r site/release-notes/* public/release-notes/; else echo "ERROR: site/release-notes not found"; echo "Contents of site:"; ls -la site || true; exit 1; fi
  dependencies:
    - build_mkdocs_release-notes
  environment:
    name: review_release-notes/${CI_COMMIT_REF_NAME}
    url: ${CI_JOB_URL}/artifacts/file/public/release-notes/index.html

# ------------------------------------------------------------------
# Deploy stage

.deploy_mkdocs_release-notes: # Deploy the MkDocs site to GitLab Pages
  variables:
    # We only need the artifacts from the build_pages job -> no need to clone the repository
    GIT_STRATEGY: none
  image:
    # We only need mv and env -> use distroless image to speed up the job
    name: gcr.io/distroless/static-debian12:debug
    entrypoint: [""]
  stage: deploy
  script:
    - >-
      if [ -d site/release-notes ]; then mkdir -p public/release-notes; cp -r site/release-notes/* public/release-notes/; else echo "ERROR: site/release-notes not found"; echo "Contents of site:"; ls -la site || true; exit 1; fi
  dependencies:
    - build_mkdocs_release-notes
  artifacts:
    paths:
      - public
    expire_in: 8h
